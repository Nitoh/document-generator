services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: document_generator
      POSTGRES_USER: document_generator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_generator -d document_generator"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
